<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lamination Hub NFC Studio</title>
<meta name="theme-color" content="#101010">
<style>
:root{--bg:#101010;--panel:#191919;--line:#303030;--text:#f7f7f7;--muted:#aaa;--orange:#ff7a1a;--green:#25b86a}
*{box-sizing:border-box}body{margin:0;background:#0c0c0c;color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
a{color:inherit}button,input,textarea,select{font:inherit}button,.btn{border:0;border-radius:12px;padding:11px 15px;background:var(--orange);color:#111;font-weight:750;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
button.secondary,.btn.secondary{background:#292929;color:white;border:1px solid #444}button.danger{background:#3b1717;color:#ffb7b7;border:1px solid #6d3030}
.wrap{max-width:1100px;margin:auto;padding:22px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:18px}
.brand{font-weight:900;letter-spacing:.4px}.brand b{color:var(--orange)}.muted{color:var(--muted)}.small{font-size:12px;color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.field label{font-size:12px;color:#ccc;font-weight:700}.field input,.field textarea,.field select{width:100%;background:#101010;border:1px solid #3b3b3b;color:white;border-radius:10px;padding:11px}.field textarea{min-height:80px;resize:vertical}
.actions{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none!important}.profile-card{max-width:560px;margin:30px auto;background:#171717;border:1px solid #333;border-radius:28px;overflow:hidden;text-align:center}.cover{height:100px;background:linear-gradient(120deg,#ff7a1a,#202020 70%)}.avatar{width:100px;height:100px;border-radius:24px;object-fit:cover;background:#222;border:4px solid #171717;margin-top:-52px}.profile-body{padding:0 22px 24px}.profile-body h1{margin:8px 0 0;font-size:27px}.tag{color:var(--orange);font-weight:700}.profile-links{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}.profile-links a{background:#262626;border:1px solid #3a3a3a;padding:12px;border-radius:12px;text-decoration:none;font-weight:700}.profile-links a.primary{background:var(--orange);color:#111;border-color:var(--orange)}.socials{display:flex;justify-content:center;gap:15px;flex-wrap:wrap;margin:18px 0}.products{text-align:left;margin-top:22px;border-top:1px solid #333;padding-top:12px}.product{padding:10px 0;border-bottom:1px solid #2e2e2e}.pill{display:inline-block;border:1px solid #444;border-radius:999px;padding:4px 9px;font-size:12px;color:#ccc}.notice{padding:12px;background:#2c210f;border:1px solid #6c4c1a;border-radius:10px;color:#ffd69a;margin-top:12px}.stat{font-size:27px;font-weight:900}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media(max-width:600px){.wrap{padding:14px}.profile-links{grid-template-columns:1fr}.profile-card{margin:14px auto}.panel{padding:14px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body><div id="app" class="wrap"></div>
<script>
/*
  Configure SUPABASE_URL and SUPABASE_ANON_KEY below before deployment.
  Only use a publishable/anon key in this public page. NEVER put service_role keys here.
*/
const SUPABASE_URL = "https://gidrjfatmwgelisebgxb.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_DAPg2Q__oyLIaLtXmnYKZw_4ZQO99jh";
const configured = !SUPABASE_URL.startsWith("YOUR_") && !SUPABASE_ANON_KEY.startsWith("YOUR_");
const sb = configured ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const val = (id) => document.getElementById(id)?.value?.trim() || "";
const slugify = s => s.toLowerCase().normalize("NFKD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,55);
const link = (url) => /^https?:\/\//i.test(url||"") ? url : (url ? "https://"+url : "");
function header(){if(new URLSearchParams(location.search).has("p"))return "";return `<div class="top"><div class="brand">LAMINATION <b>HUB</b> <span class="pill">NFC STUDIO</span></div><div class="actions"><a class="btn secondary" href="./">Home</a><button class="secondary" onclick="showAdmin()">Admin Panel</button></div></div>`}
function setupNotice(){return `<div class="notice"><b>Setup required:</b> add your Supabase project URL and publishable/anon key in <code>index.html</code>, then run <code>schema.sql</code> in Supabase SQL Editor. No private service-role key belongs in this file.</div>`}
function home(){app.innerHTML=header()+`<section class="panel"><h1>One tap. Every detail.</h1><p class="muted">Create digital visiting cards for every customer, then connect each profile to an NFC chip and QR code.</p><div class="grid"><div class="panel"><div class="stat">01</div><b>Customer profiles</b><p class="muted">Unique links, contact details, social links, location and services.</p></div><div class="panel"><div class="stat">02</div><b>NFC + QR</b><p class="muted">Write the profile URL to an NFC card and print the same URL as a QR code.</p></div><div class="panel"><div class="stat">03</div><b>One admin</b><p class="muted">Manage all profiles from one authenticated dashboard.</p></div></div><div class="actions"><button onclick="showAdmin()">Open Admin Panel</button></div>${configured?"":setupNotice()}</section><p class="small">Customer profiles only appear publicly when their status is Active.</p>`}
function showAdmin(){if(!configured){home();return;} renderLogin();}
async function renderLogin(){const {data:{session}}=await sb.auth.getSession();if(session){renderDashboard();return;}app.innerHTML=header()+`<section class="panel" style="max-width:480px;margin:30px auto"><h1>Admin Login</h1><p class="muted">Sign in with the authorized admin account.</p><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><div class="actions"><button onclick="login()">Sign in</button></div><p id="msg" class="small"></p></section>`}
async function login(){const {error}=await sb.auth.signInWithPassword({email:val("email"),password:val("password")});if(error){document.getElementById("msg").textContent=error.message;return;}renderDashboard();}
async function logout(){await sb.auth.signOut();home();}
async function renderDashboard(){const {data:{user}}=await sb.auth.getUser();if(!user){renderLogin();return;}
const {data:profiles,error}=await sb.from("card_profiles").select("*").order("created_at",{ascending:false});
app.innerHTML=header()+`<div class="row" style="margin-top:22px"><div><h1 style="margin:0">Customer profiles</h1><div class="muted">Signed in as ${esc(user.email)}</div></div><div class="actions"><button onclick="newProfile()">+ Create profile</button><button class="secondary" onclick="logout()">Sign out</button></div></div>${error?`<div class="notice">${esc(error.message)}</div>`:""}<div class="grid" style="margin-top:16px"><div class="panel"><div class="stat">${(profiles||[]).length}</div><div class="muted">Total profiles</div></div><div class="panel"><div class="stat">${(profiles||[]).filter(p=>p.is_active).length}</div><div class="muted">Active profiles</div></div></div><div class="panel"><div class="row"><h2>All profiles</h2><input id="search" placeholder="Search customer..." oninput="filterRows()" style="max-width:260px;background:#101010;border:1px solid #444;color:white;padding:10px;border-radius:10px"></div><div id="rows">${(profiles||[]).map(profileRow).join("")||'<p class="muted">No profiles yet. Create the first customer profile.</p>'}</div></div>`;
}
function profileRow(p){let url=location.origin+location.pathname+"?p="+encodeURIComponent(p.slug);return `<div class="panel profile-row" data-search="${esc((p.full_name+" "+p.business_name+" "+p.phone+" "+p.slug).toLowerCase())}"><div class="row"><div><b>${esc(p.business_name||p.full_name)}</b><div class="muted">${esc(p.full_name)} · /?p=${esc(p.slug)}</div><span class="pill">${p.is_active?"Active":"Inactive"}</span></div><div class="actions"><button class="secondary" onclick="editProfile('${p.id}')">Edit</button><button class="secondary" onclick="copyText('${url}')">Copy link</button><button class="secondary" onclick="window.open('${url.replace(/'/g,"%27")}','_blank')">Preview</button><button class="danger" onclick="deleteProfile('${p.id}')">Delete</button></div></div></div>`}
function filterRows(){let q=val("search").toLowerCase();document.querySelectorAll(".profile-row").forEach(el=>el.classList.toggle("hidden",!el.dataset.search.includes(q)))}
const fields=[["full_name","Customer / contact name"],["business_name","Business name"],["slug","Profile URL slug"],["tagline","Tagline"],["phone","Phone number"],["whatsapp","WhatsApp number (country code, no +)"],["email","Public email"],["address","Business address"],["website","Website URL"],["instagram","Instagram URL or username"],["facebook","Facebook URL"],["maps_url","Google Maps link"],["logo_url","Logo / profile photo URL"],["services","Products & services (one per line)"],["payment_url","UPI/payment link URL"],["theme_color","Accent color (hex, e.g. #ff7a1a)"]];
function newProfile(){editForm(null,{full_name:"",business_name:"",slug:"",tagline:"",phone:"",whatsapp:"",email:"",address:"",website:"",instagram:"",facebook:"",maps_url:"",logo_url:"",services:"",payment_url:"",theme_color:"#ff7a1a",is_active:true});}
async function editProfile(id){let p=null;if(id){const {data,error}=await sb.from("card_profiles").select("*").eq("id",id).single();if(error){alert(error.message);return;}p={...data,services:(data.services||[]).join("\n")};}editForm(id,p||{});}
function editForm(id,p){app.innerHTML=header()+`<section class="panel"><div class="row"><h1>${id?"Edit profile":"Create customer profile"}</h1><button class="secondary" onclick="renderDashboard()">Back</button></div><p class="muted">Use a unique slug for each customer. This becomes their public profile link.</p><div class="grid">${fields.map(([k,l])=>`<div class="field" style="${k==="services"?"grid-column:1/-1":""}"><label>${l}</label>${k==="services"?`<textarea id="f_${k}">${esc(p[k]||"")}</textarea>`:k==="logo_url"?`<input id="f_logo_url" value="${esc(p.logo_url||"")}" placeholder="Optional image URL"><input id="logo_file" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/svg+xml"><small class="small">Or upload a logo/profile photo (PNG, JPG, WEBP, GIF, SVG; max 5 MB). Uploading a file replaces the URL above.</small>`:`<input id="f_${k}" value="${esc(p[k]||"")}" ${k==="slug"?'placeholder="e.g. rahul-mobile-shop"':""} ${k==="theme_color"?'type="text"':""}>`}</div>`).join("")}</div><div class="field"><label><input id="f_is_active" type="checkbox" ${p.is_active===false?"":"checked"} style="width:auto"> Public profile active</label></div><div class="actions"><button onclick="saveProfile('${id||""}')">Save profile</button><button class="secondary" onclick="renderDashboard()">Cancel</button></div><p id="msg" class="small"></p></section>`;document.getElementById("f_business_name").addEventListener("input",()=>{if(!id&&!val("slug"))document.getElementById("f_slug").value=slugify(val("f_business_name")||val("f_full_name"));});document.getElementById("f_full_name").addEventListener("input",()=>{if(!id&&!val("slug"))document.getElementById("f_slug").value=slugify(val("f_business_name")||val("f_full_name"));});}
async function saveProfile(id){let data={};fields.forEach(([k])=>data[k]=val("f_"+k));data.slug=slugify(data.slug);if(!data.full_name||!data.slug){document.getElementById("msg").textContent="Customer name and profile slug are required.";return;}data.services=data.services.split("\n").map(s=>s.trim()).filter(Boolean);data.is_active=document.getElementById("f_is_active").checked;data.theme_color=/^#[0-9a-f]{6}$/i.test(data.theme_color)?data.theme_color:"#ff7a1a";const file=document.getElementById("logo_file")?.files?.[0];if(file){const allowed=["image/png","image/jpeg","image/webp","image/gif","image/svg+xml"];if(!allowed.includes(file.type)||file.size>5*1024*1024){document.getElementById("msg").textContent="Choose a supported image up to 5 MB.";return;}const ext=({"image/png":"png","image/jpeg":"jpg","image/webp":"webp","image/gif":"gif","image/svg+xml":"svg"})[file.type];const path=data.slug+"/"+Date.now()+"."+ext;document.getElementById("msg").textContent="Uploading image…";const {error:uploadError}=await sb.storage.from("customer-logos").upload(path,file,{upsert:true,contentType:file.type});if(uploadError){document.getElementById("msg").textContent="Image upload failed: "+uploadError.message;return;}data.logo_url=sb.storage.from("customer-logos").getPublicUrl(path).data.publicUrl;}let res=id?await sb.from("card_profiles").update(data).eq("id",id):await sb.from("card_profiles").insert(data);if(res.error){document.getElementById("msg").textContent=res.error.message;return;}renderDashboard();}
async function deleteProfile(id){if(!confirm("Delete this customer profile permanently?"))return;const {error}=await sb.from("card_profiles").delete().eq("id",id);if(error)alert(error.message);else renderDashboard();}
async function copyText(t){try{await navigator.clipboard.writeText(t);alert("Profile link copied");}catch(e){prompt("Copy profile link:",t)}}
async function publicProfile(slug){if(!configured){home();return;}const {data:p,error}=await sb.from("card_profiles").select("*").eq("slug",slug).eq("is_active",true).maybeSingle();if(error||!p){app.innerHTML=header()+`<section class="panel"><h1>Profile not found</h1><p class="muted">This profile may be inactive or the link may be incorrect.</p><a href="./" class="btn secondary">Home</a></section>`;return;}
const wa=(p.whatsapp||p.phone||"").replace(/\D/g,"");const social=(label,url)=>url?`<a href="${esc(link(url))}" target="_blank" rel="noopener">${label}</a>`:"";
const services=(p.services||[]).map(s=>`<div class="product">${esc(s)}</div>`).join("");
const vcard=`BEGIN:VCARD\nVERSION:3.0\nFN:${p.full_name||""}\nORG:${p.business_name||""}\nTEL;TYPE=CELL:${p.phone||""}\nEMAIL:${p.email||""}\nADR:;;${p.address||""};;;;\nURL:${location.href}\nEND:VCARD`;
app.innerHTML=header()+`<article class="profile-card" style="--orange:${esc(p.theme_color||"#ff7a1a")}"><div class="cover" style="background:linear-gradient(120deg,${esc(p.theme_color||"#ff7a1a")},#202020 75%)"></div>${p.logo_url?`<img class="avatar" src="${esc(link(p.logo_url))}" alt="Profile photo" onerror="this.style.display='none'">`:`<div class="avatar" style="display:inline-flex;align-items:center;justify-content:center;font-size:34px;color:${esc(p.theme_color||"#ff7a1a")}">✦</div>`}<div class="profile-body"><h1>${esc(p.business_name||p.full_name)}</h1><div>${esc(p.full_name)}</div><div class="tag">${esc(p.tagline||"Digital Visiting Card")}</div><p class="muted">${esc(p.address||"")}</p><div class="profile-links"><a class="primary" href="tel:${esc(p.phone||"")}">☎ Call</a>${wa?`<a href="https://wa.me/${esc(wa)}?text=${encodeURIComponent("Hello "+(p.business_name||p.full_name)+", I found your digital visiting card.")}" target="_blank">WhatsApp</a>`:""}<a href="#" onclick="downloadVCard(${JSON.stringify(vcard).replace(/</g,"\\u003c")});return false">＋ Save Contact</a>${p.maps_url?`<a href="${esc(link(p.maps_url))}" target="_blank">⌖ Directions</a>`:""}${p.website?`<a href="${esc(link(p.website))}" target="_blank">Website</a>`:""}${p.payment_url?`<a href="${esc(link(p.payment_url))}" target="_blank">₹ Pay Now</a>`:""}</div><div class="socials">${social("Instagram",p.instagram&&p.instagram.includes("://")?p.instagram:"https://instagram.com/"+(p.instagram||"").replace(/^@/,""))}${social("Facebook",p.facebook)}${p.email?`<a href="mailto:${esc(p.email)}">Email</a>`:""}</div>${services?`<div class="products"><h3>Products & Services</h3>${services}</div>`:""}<div class="actions" style="justify-content:center;margin-top:22px"><button onclick="shareProfile()">Share profile</button><button class="secondary" onclick="downloadQR()">QR code</button></div><p class="small">Powered by Lamination Hub NFC Studio</p></div></article>`;
window.currentProfileUrl=location.href;}
function downloadVCard(text){const blob=new Blob([text],{type:"text/vcard"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="contact.vcf";a.click();URL.revokeObjectURL(a.href);}
async function shareProfile(){if(navigator.share){try{await navigator.share({title:document.title,url:location.href});}catch(e){}}else copyText(location.href);}
function downloadQR(){const url="https://api.qrserver.com/v1/create-qr-code/?size=600x600&data="+encodeURIComponent(location.href);const a=document.createElement("a");a.href=url;a.target="_blank";a.rel="noopener";a.click();}
async function route(){const slug=new URLSearchParams(location.search).get("p");if(slug)publicProfile(slug);else home();}
route();
</script></body></html>
